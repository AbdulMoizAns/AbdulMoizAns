      <text x="12" y="26" fill="#c084fc" font-size="18" font-weight="800">&lt; 500ms</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9">POS Cashout Flow</text>
      <text x="12" y="52" fill="#a855f7" font-size="8">NIZAAM Cloud ERP</text>
