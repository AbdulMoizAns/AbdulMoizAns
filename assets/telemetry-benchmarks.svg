    <text x="750" y="4" fill="#64748b" font-size="10" letter-spacing="1">REF: 2026-OCT-SYS</text>
  </g>

  <!-- 6 Metrics columns -->
  <g class="font-mono" transform="translate(24, 52)">
    
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="60" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="12" y="26" fill="#00f0ff" font-size="18" font-weight="800">0% LEAK</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9">2ip.io Audit Passed</text>
      <text x="12" y="52" fill="#38bdf8" font-size="8">XION Layer-3 TUN</text>
