<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%" style="background:#070a12;border-radius:12px;overflow:hidden;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="950" height="140" fill="url(#bgCard)" />
  <rect width="950" height="140" fill="url(#cardGrid)" />
  <rect x="8" y="8" width="934" height="124" rx="8" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
  
    <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 930 8 L 942 8 L 942 20" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 8 120 L 8 132 L 20 132" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 930 132 L 942 132 L 942 120" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    

  <!-- Header line -->
