      <text x="12" y="26" fill="#00f0ff" font-size="18" font-weight="800">430+</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9">Validated REST APIs</text>
      <text x="12" y="52" fill="#38bdf8" font-size="8">Combined Endpoints</text>
    </g>

    <!-- Col 5 -->
    <g transform="translate(608, 0)">
      <rect width="140" height="60" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="12" y="26" fill="#c084fc" font-size="18" font-weight="800">100%</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9">Zero-Trust Air-Gap</text>
