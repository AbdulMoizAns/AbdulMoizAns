      <text x="12" y="26" fill="#fbbf24" font-size="18" font-weight="800">NATIVE C</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9">Nuitka Standalone</text>
      <text x="12" y="52" fill="#f59e0b" font-size="8">Bytecode Eliminated</text>
