<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="100%" style="background:transparent;">
  <defs>
    <linearGradient id="lineGradLeft_contact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="lineGradRight_contact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glowSec_contact" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left glowing line -->
  <line x1="40" y1="24" x2="294" y2="24" stroke="url(#lineGradLeft_contact)" stroke-width="1.5" />
  <!-- Left diamond accent -->
  <polygon points="304,24 308,20 312,24 308,28" fill="#00F0FF" filter="url(#glowSec_contact)" />

  <!-- Centered Clean Title -->
  <text x="475" y="29" fill="#00F0FF" font-size="13" font-weight="800" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" letter-spacing="3" text-anchor="middle" filter="url(#glowSec_contact)">COMMUNICATION CHANNELS</text>

  <!-- Right diamond accent -->
  <polygon points="638,24 642,20 646,24 642,28" fill="#00F0FF" filter="url(#glowSec_contact)" />
  <!-- Right glowing line -->
  <line x1="656" y1="24" x2="910" y2="24" stroke="url(#lineGradRight_contact)" stroke-width="1.5" />
</svg>