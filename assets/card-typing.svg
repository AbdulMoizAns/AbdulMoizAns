<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%" style="background:#070a12;border-radius:12px;overflow:hidden;cursor:pointer;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="460" height="250" fill="url(#bgCard)" />
  <rect width="460" height="250" fill="url(#cardGrid)" />
  <rect x="6" y="6" width="448" height="238" rx="8" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35" />
  
    <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path d="M 440 8 L 452 8 L 452 20" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path d="M 8 230 L 8 242 L 20 242" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path d="M 440 242 L 452 242 L 452 230" fill="none" stroke="#a855f7" stroke-width="2.5" />
    

  <!-- Top bar -->
  <g class="font-mono" transform="translate(24, 28)">
    <text x="0" y="4" fill="#a855f7" font-size="11" font-weight="700" letter-spacing="1">[SYS-06 // NLP ASSISTANT]</text>
    
    <!-- Badge -->
    <g transform="translate(260, -8)">
      <rect width="150" height="20" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
      <circle cx="10" cy="10" r="3" fill="#a855f7" filter="url(#glow)" />
      <text x="20" y="14" fill="#a855f7" font-size="9" font-weight="700" letter-spacing="0.5">100% PASS (69/69)</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(24, 60)">
    <text x="0" y="16" fill="#f8fafc" font-size="19" font-weight="800" class="font-sans" letter-spacing="-0.3">ALPHA AI TYPING ENGINE</text>
    <text x="0" y="34" fill="#a855f7" font-size="11" font-weight="600" class="font-mono">AIR-GAPPED GLOBAL WINDOWS ACCELERATOR</text>
    <line x1="0" y1="44" x2="412" y2="44" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Bullets -->
  
        <g transform="translate(24, 115)">
          <circle cx="4" cy="4" r="2.5" fill="#a855f7" />
          <text x="14" y="8" fill="#cbd5e1" font-size="11" class="font-sans">Gboard-style spacebar predictions powered by N-gram context</text>
        </g>
        <g transform="translate(24, 139)">
          <circle cx="4" cy="4" r="2.5" fill="#a855f7" />
          <text x="14" y="8" fill="#cbd5e1" font-size="11" class="font-sans">Dual-language phonetic engine for Roman Urdu &amp; international English</text>
        </g>
        <g transform="translate(24, 163)">
          <circle cx="4" cy="4" r="2.5" fill="#a855f7" />
          <text x="14" y="8" fill="#cbd5e1" font-size="11" class="font-sans">Zero-trust offline air-gap firewall ensuring zero keystroke leaks</text>
        </g>

  <!-- Chips -->
  <g>
    
        <g transform="translate(24, 205)">
          <rect width="61.0" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
          <text x="30.5" y="15" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Python</text>
        </g>
        <g transform="translate(93.0, 205)">
          <rect width="98.5" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
          <text x="49.25" y="15" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">NLP N-Grams</text>
        </g>
        <g transform="translate(199.5, 205)">
          <rect width="68.5" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
          <text x="34.25" y="15" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">pywin32</text>
        </g>
        <g transform="translate(276.0, 205)">
          <rect width="68.5" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
          <text x="34.25" y="15" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Air-Gap</text>
        </g>
  </g>
</svg>