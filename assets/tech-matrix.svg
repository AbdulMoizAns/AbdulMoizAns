<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="100%" style="background:#070a12;border-radius:12px;overflow:hidden;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="950" height="300" fill="url(#bgCard)" />
  <rect width="950" height="300" fill="url(#cardGrid)" />
  <rect x="8" y="8" width="934" height="284" rx="8" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />
  
    <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 930 8 L 942 8 L 942 20" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 8 280 L 8 292 L 20 292" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 930 292 L 942 292 L 942 280" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    

  <!-- Header -->
  <g class="font-mono" transform="translate(28, 30)">
    <circle cx="6" cy="0" r="4" fill="#00f0ff" filter="url(#glow)" />
    <text x="18" y="4" fill="#00f0ff" font-size="12" font-weight="700" letter-spacing="1.5">CORE TECHNOLOGY MATRIX • PRODUCTION STACK</text>
  </g>

  <!-- 4 Quadrants -->
  <g class="font-mono" transform="translate(28, 54)">
    
    <!-- Quadrant 1: Systems & Kernel -->
    <g transform="translate(0, 0)">
      <rect width="435" height="105" rx="6" fill="#090e1a" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.4" />
      <text x="16" y="24" fill="#00f0ff" font-size="11" font-weight="700">🖥️ SYSTEMS, DRIVERS &amp; KERNEL</text>
      <text x="16" y="40" fill="#64748b" font-size="9">Low-Level Windows APIs &amp; Layer-3 Networking</text>
      
      <!-- Tags -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="85" height="18" rx="3" fill="#1e293b" /><text x="42" y="13" fill="#38bdf8" font-size="9" text-anchor="middle">Python 3.12</text>
        <rect x="92" y="0" width="100" height="18" rx="3" fill="#1e293b" /><text x="142" y="13" fill="#fbbf24" font-size="9" text-anchor="middle">Nuitka Native C</text>
        <rect x="199" y="0" width="85" height="18" rx="3" fill="#1e293b" /><text x="241" y="13" fill="#38bdf8" font-size="9" text-anchor="middle">Win32 API</text>
        <rect x="291" y="0" width="100" height="18" rx="3" fill="#1e293b" /><text x="341" y="13" fill="#38bdf8" font-size="9" text-anchor="middle">Wintun Driver</text>
        
        <rect x="0" y="24" width="115" height="18" rx="3" fill="#1e293b" /><text x="57" y="37" fill="#fb923c" font-size="9" text-anchor="middle">Layer-3 TUN Route</text>
        <rect x="122" y="24" width="85" height="18" rx="3" fill="#1e293b" /><text x="164" y="37" fill="#fb923c" font-size="9" text-anchor="middle">Sing-Box</text>
        <rect x="214" y="24" width="75" height="18" rx="3" fill="#1e293b" /><text x="251" y="37" fill="#4ade80" font-size="9" text-anchor="middle">PyQt6 GUI</text>
        <rect x="296" y="24" width="95" height="18" rx="3" fill="#1e293b" /><text x="343" y="37" fill="#4ade80" font-size="9" text-anchor="middle">FFmpeg Muxer</text>
      </g>
    </g>

    <!-- Quadrant 2: Cryptography & Security -->
    <g transform="translate(458, 0)">
      <rect width="435" height="105" rx="6" fill="#090e1a" stroke="#a855f7" stroke-width="0.7" stroke-opacity="0.4" />
      <text x="16" y="24" fill="#c084fc" font-size="11" font-weight="700">🔒 CRYPTOGRAPHY &amp; PROTOCOLS</text>
      <text x="16" y="40" fill="#64748b" font-size="9">Asymmetric Auth, Anti-Piracy &amp; Zero-Trust</text>
      
      <!-- Tags -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="125" height="18" rx="3" fill="#1e293b" /><text x="62" y="13" fill="#c084fc" font-size="9" text-anchor="middle">RSA-2048 Asymmetric</text>
        <rect x="132" y="0" width="105" height="18" rx="3" fill="#1e293b" /><text x="184" y="13" fill="#38bdf8" font-size="9" text-anchor="middle">Windows DPAPI</text>
        <rect x="244" y="0" width="145" height="18" rx="3" fill="#1e293b" /><text x="316" y="13" fill="#fb923c" font-size="9" text-anchor="middle">Cloudflare DoH 1.1.1.1</text>
        
        <rect x="0" y="24" width="105" height="18" rx="3" fill="#1e293b" /><text x="52" y="37" fill="#34d399" font-size="9" text-anchor="middle">AES-256-GCM</text>
        <rect x="112" y="24" width="125" height="18" rx="3" fill="#1e293b" /><text x="174" y="37" fill="#34d399" font-size="9" text-anchor="middle">HIBP k-Anonymity</text>
        <rect x="244" y="24" width="145" height="18" rx="3" fill="#1e293b" /><text x="316" y="37" fill="#c084fc" font-size="9" text-anchor="middle">HWID Fingerprint Lock</text>
      </g>
    </g>

    <!-- Quadrant 3: Distributed SaaS & Web -->
    <g transform="translate(0, 118)">
      <rect width="435" height="105" rx="6" fill="#090e1a" stroke="#10b981" stroke-width="0.7" stroke-opacity="0.4" />
      <text x="16" y="24" fill="#34d399" font-size="11" font-weight="700">☁️ DISTRIBUTED SAAS &amp; HIGH-THROUGHPUT WEB</text>
      <text x="16" y="40" fill="#64748b" font-size="9">Sub-Second POS Pipelines &amp; Multi-Tenant APIs</text>
      
      <!-- Tags -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="145" height="18" rx="3" fill="#1e293b" /><text x="72" y="13" fill="#f8fafc" font-size="9" text-anchor="middle">Next.js 15 Server Act</text>
        <rect x="152" y="0" width="95" height="18" rx="3" fill="#1e293b" /><text x="199" y="13" fill="#38bdf8" font-size="9" text-anchor="middle">React 19 / 18</text>
        <rect x="254" y="0" width="135" height="18" rx="3" fill="#1e293b" /><text x="321" y="13" fill="#34d399" font-size="9" text-anchor="middle">FastAPI Async Daemon</text>
        
        <rect x="0" y="24" width="95" height="18" rx="3" fill="#1e293b" /><text x="47" y="37" fill="#38bdf8" font-size="9" text-anchor="middle">TypeScript</text>
        <rect x="102" y="24" width="115" height="18" rx="3" fill="#1e293b" /><text x="159" y="37" fill="#fb923c" font-size="9" text-anchor="middle">Hono Edge Runtime</text>
        <rect x="224" y="24" width="95" height="18" rx="3" fill="#1e293b" /><text x="271" y="37" fill="#38bdf8" font-size="9" text-anchor="middle">Tailwind CSS</text>
        <rect x="326" y="24" width="65" height="18" rx="3" fill="#1e293b" /><text x="358" y="37" fill="#c084fc" font-size="9" text-anchor="middle">Vite</text>
      </g>
    </g>

    <!-- Quadrant 4: Databases & DevOps -->
    <g transform="translate(458, 118)">
      <rect width="435" height="105" rx="6" fill="#090e1a" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.4" />
      <text x="16" y="24" fill="#00f0ff" font-size="11" font-weight="700">🗄️ PERSISTENCE, MESH &amp; DEVOPS</text>
      <text x="16" y="40" fill="#64748b" font-size="9">WAL Concurrency, Edge Replication &amp; Vector PDFs</text>
      
      <!-- Tags -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="95" height="18" rx="3" fill="#1e293b" /><text x="47" y="13" fill="#60a5fa" font-size="9" text-anchor="middle">PostgreSQL</text>
        <rect x="102" y="0" width="135" height="18" rx="3" fill="#1e293b" /><text x="169" y="13" fill="#22d3ee" font-size="9" text-anchor="middle">SQLite (WAL Concurrency)</text>
        <rect x="244" y="0" width="145" height="18" rx="3" fill="#1e293b" /><text x="316" y="13" fill="#00f0ff" font-size="9" text-anchor="middle">Turso LibSQL Edge</text>
        
        <rect x="0" y="24" width="95" height="18" rx="3" fill="#1e293b" /><text x="47" y="37" fill="#cbd5e1" font-size="9" text-anchor="middle">Prisma ORM</text>
        <rect x="102" y="24" width="75" height="18" rx="3" fill="#1e293b" /><text x="139" y="37" fill="#38bdf8" font-size="9" text-anchor="middle">Docker</text>
        <rect x="184" y="24" width="135" height="18" rx="3" fill="#1e293b" /><text x="251" y="37" fill="#fb7185" font-size="9" text-anchor="middle">ReportLab Vector PDF</text>
        <rect x="326" y="24" width="65" height="18" rx="3" fill="#1e293b" /><text x="358" y="37" fill="#38bdf8" font-size="9" text-anchor="middle">Inno Setup</text>
      </g>
    </g>

  </g>
</svg>