<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 50" width="100%" height="100%" style="background:transparent;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <line x1="20" y1="25" x2="160" y2="25" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="165" cy="25" r="3.5" fill="#00F0FF" filter="url(#glow)" />
  <text x="180" y="30" fill="#00F0FF" font-size="14" font-weight="800" class="font-mono" letter-spacing="2">FEATURED WORKSTATIONS &amp; SYSTEMS</text>
  <text x="560" y="29" fill="#64748b" font-size="10" font-weight="500" class="font-mono">// PRODUCTION ARCHITECTURES</text>
  <line x1="820" y1="25" x2="930" y2="25" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" />
</svg>