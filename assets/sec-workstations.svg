<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="100%" style="background:transparent;">
  <defs>
    <linearGradient id="lineGradLeft_workstations" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="lineGradRight_workstations" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glowSec_workstations" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left glowing line -->
  <line x1="40" y1="24" x2="236" y2="24" stroke="url(#lineGradLeft_workstations)" stroke-width="1.5" />
  <!-- Left diamond accent -->
  <polygon points="246,24 250,20 254,24 250,28" fill="#00F0FF" filter="url(#glowSec_workstations)" />

  <!-- Centered Clean Title -->
  <text x="475" y="29" fill="#00F0FF" font-size="13" font-weight="800" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" letter-spacing="3" text-anchor="middle" filter="url(#glowSec_workstations)">FEATURED WORKSTATIONS &amp; SYSTEMS</text>

  <!-- Right diamond accent -->
  <polygon points="696,24 700,20 704,24 700,28" fill="#00F0FF" filter="url(#glowSec_workstations)" />
  <!-- Right glowing line -->
  <line x1="714" y1="24" x2="910" y2="24" stroke="url(#lineGradRight_workstations)" stroke-width="1.5" />
</svg>