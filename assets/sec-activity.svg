<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="100%" style="background:transparent;">
  <defs>
    <linearGradient id="lineGradLeft_activity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="lineGradRight_activity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="glowSec_activity" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left glowing line -->
  <line x1="40" y1="24" x2="268" y2="24" stroke="url(#lineGradLeft_activity)" stroke-width="1.5" />
  <!-- Left diamond accent -->
  <polygon points="278,24 282,20 286,24 282,28" fill="#10B981" filter="url(#glowSec_activity)" />

  <!-- Centered Clean Title -->
  <text x="475" y="29" fill="#10B981" font-size="13" font-weight="800" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" letter-spacing="3" text-anchor="middle" filter="url(#glowSec_activity)">TELEMETRY &amp; GITHUB METRICS</text>

  <!-- Right diamond accent -->
  <polygon points="664,24 668,20 672,24 668,28" fill="#10B981" filter="url(#glowSec_activity)" />
  <!-- Right glowing line -->
  <line x1="682" y1="24" x2="910" y2="24" stroke="url(#lineGradRight_activity)" stroke-width="1.5" />
</svg>